services:
  quotes:
    build: .
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "${INVOIFY_BIND_ADDRESS:-127.0.0.1}:${INVOIFY_PORT:-3010}:3000"
    volumes:
      - quote-sessions:/var/lib/invoify/sessions
      - ${INVOIFY_PROFILE_FILE:?Set INVOIFY_PROFILE_FILE}:/etc/invoify/company.json:ro
volumes:
  quote-sessions:
